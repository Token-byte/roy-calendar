name: Roulette events

on:
  schedule:
    # GitHub cron is UTC. 04:00 and 14:00 UTC are 06:00 and 16:00 in Israel
    # standard time, and 07:00 and 17:00 during daylight saving time.
    - cron: '0 4 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public events
        run: python roulette/scripts/collect_events.py
      - name: Commit events.json when it changed
        run: |
          git diff --quiet -- roulette/data/events.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roulette/data/events.json
          git commit -m "Update roulette events"
          git push
